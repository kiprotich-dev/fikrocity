<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="76" y1="60" x2="568" y2="584" gradientUnits="userSpaceOnUse"><stop stop-color="#111C35"/><stop offset="1" stop-color="#080D1A"/></linearGradient>
    <linearGradient id="top" x1="208" y1="150" x2="420" y2="355" gradientUnits="userSpaceOnUse"><stop stop-color="#74F3DE"/><stop offset=".48" stop-color="#25D5C2"/><stop offset="1" stop-color="#5578FF"/></linearGradient>
    <linearGradient id="side" x1="408" y1="204" x2="455" y2="467" gradientUnits="userSpaceOnUse"><stop stop-color="#3CA9C4"/><stop offset="1" stop-color="#293DA3"/></linearGradient>
    <linearGradient id="front" x1="193" y1="250" x2="420" y2="412" gradientUnits="userSpaceOnUse"><stop stop-color="#E7FFFC"/><stop offset=".24" stop-color="#48E1CF"/><stop offset="1" stop-color="#6B82FF"/></linearGradient>
    <filter id="shadow" x="95" y="104" width="474" height="490" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="25"/></filter>
